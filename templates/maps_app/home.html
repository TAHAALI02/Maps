{% extends "base.html" %}
{% load static %}

{% block title %}Maps Home{% endblock %}

{% block body_class %}map-page{% endblock %}

{% block extra_css %}
<!-- Map page styles -->
<link rel="stylesheet" href="{% static 'css/home.css' %}">
<link rel="stylesheet" href="{% static 'css/road-popup.css' %}">
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
<style>

</style>
{% endblock %}

{% block content %}
<div id="mapWrapper" style="position:relative;">
    <div id="map"></div>


<!-- ================= Polyline Properties Panel ================= -->
<div id="stylePanel" class="polyline-panel" data-request-id="">
    <div class="polyline-panel-header">
        <h3 class="polyline-panel-title" id="stylePanelTitle">Style Feature</h3>
        <button id="closePanel" class="polyline-panel-close" title="Cancel">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>

    <!-- Status Badge (Hidden until saved) -->
    <div id="polylineStatusBadge" class="polyline-status-badge">
        <span class="status-dot"></span> Pending Approval
    </div>

    <!-- Error container -->
    <div id="polylineErrors" class="polyline-errors" style="display: none;"></div>

    <div class="polyline-panel-body">
        <div class="form-group">
            <label class="form-label feature-name"> Name</label>
            <input type="text" id="polyName" class="form-control" placeholder="Optional">
        </div>
        
        <div class="form-group">
            <label class="form-label">Description</label>
            <textarea id="polyDesc" class="form-control" rows="2" placeholder="Optional notes"></textarea>
        </div>

        <div class="form-group">
            <label class="form-label">Line Type</label>
            <div class="toggle-group" id="polyLineType">
                <button class="toggle-btn active" data-style="solid">Solid</button>
                <button class="toggle-btn" data-style="dashed">Dashed</button>
                <button class="toggle-btn" data-style="dotted">Dotted</button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Line Color</label>
            <div class="color-picker-wrapper">
                <input type="color" id="polyColor" value="#111111">
                <span id="polyColorHex" class="color-hex-display">#111111</span>
            </div>
        </div>

        <div class="form-group">
            <div class="range-header">
                <label class="form-label">Stroke Width</label>
                <span id="polyWidthVal" class="range-value">4px</span>
            </div>
            <input type="range" id="polyWidth" min="1" max="15" value="4" class="range-slider">
        </div>
        
        <div class="form-group">
            <div class="range-header">
                <label class="form-label">Opacity</label>
                <span id="polyOpacityVal" class="range-value">80%</span>
            </div>
            <input type="range" id="polyOpacity" min="10" max="100" value="80" step="10" class="range-slider">
        </div>
        <!-- Polygon-only fields — shown only when drawing/editing a polygon -->
        <div id="polygonOnlyFields" style="display: none;">
            <div class="form-group">
                <label class="form-label">Fill Color</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="polyFillColor" value="#33cc33">
                    <span id="polyFillColorHex" class="color-hex-display">#33CC33</span>
                </div>
            </div>

            <div class="form-group">
                <div class="range-header">
                    <label class="form-label">Fill Opacity</label>
                    <span id="polyFillOpacityVal" class="range-value">40%</span>
                </div>
                <input type="range" id="polyFillOpacity" min="0" max="100" value="40" step="10" class="range-slider">
            </div>
        </div>
    </div>

    <div class="polyline-panel-footer">
        <button id="cancelStyleBtn" class="btn btn-secondary">Cancel</button>
        <button id="saveStyleBtn" class="btn btn-primary">Submit Changes</button>
    </div>
</div>
<!-- ================= End Polyline Properties Panel ================= -->
</div>

<!-- ================= Road Info Popup Template ================= -->
<template id="featurePopupTemplate">
    <div class="road-popup">
        <div class="road-popup-header">
            <img class="road-popup-avatar" style="display:none;">
            <div class="road-popup-avatar-fallback" style="display:none;"></div>
            <div>
                <div class="road-popup-name"></div>
                <div class="road-popup-username"></div>
            </div>
        </div>
        <div class="road-popup-title"></div>
        <div class="road-popup-description" style="display:none;"></div>
        <div class="road-popup-meta"></div>
        {% comment %} <button class="road-popup-edit-btn" style="display:none;"></button> {% endcomment %}
        <div class="road-popup-actions">
            <button class="road-popup-edit-btn" style="display:none;">
                Edit Road
            </button>
                
            <button class="road-popup-delete-btn" style="display:none;">
                Delete Road
            </button>
            
        </div>
    </div>
</template>
<!-- ================= End Road Info Popup Template ================= -->

{% endblock %}

{% block extra_js %}


<!--leaflet JS-->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>  <!-- NEW -->
<script src="https://unpkg.com/leaflet-textpath@1.2.3/leaflet.textpath.js"></script> <!-- TextPath for road names -->


<!-- Django-rendered config passed to the external JS file -->
<script>
    window.MAP_CONFIG = {
        isAuthenticated: {{ user.is_authenticated|yesno:"true,false" }},
        isSuperuser: {{ user.is_superuser|yesno:"true,false" }},
        lat: {{ data.latitude }},
        lng: {{ data.longitude }},
        zoom: {{ data.zoom }},
        apiKey: "UdxTHX9c3miBvaRx3DzT",
        urls: {
            login: "{% url 'login' %}",
            getApprovedFeatures: "{% url 'get_approved_features' %}",
            getMyDraftFeatures: "{% url 'get_my_draft_features' %}",
            submitFeatureRequest: "{% url 'submit_feature_request' %}"
        },
        icons: {
            pointer: "{% static 'images/pointer.png' %}",
            marker: "{% static 'images/marker.png' %}"
        }
    };
</script>

<script src="{% static 'js/home.js' %}"></script>

{% endblock %}
